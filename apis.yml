apis:
- aid: signal:signal-protocol-specifications
  name: Signal Protocol Specifications
  tags:
  - Encryption
  - Messaging
  - Cryptography
  - Security
  - Protocols
  humanURL: https://signal.org/docs/
  properties:
  - url: https://signal.org/docs/
    type: Documentation
  description: >-
    The Signal Protocol Specifications define the core cryptographic protocols that underpin Signal's
    end-to-end encrypted messaging. These include the X3DH (Extended Triple Diffie-Hellman) key agreement
    protocol for establishing shared secrets between parties, the Double Ratchet Algorithm for deriving
    new encryption keys per message, the PQXDH (Post-Quantum Extended Diffie-Hellman) protocol for quantum-resistant
    key agreement, and XEdDSA for EdDSA-compatible signature schemes. These specifications are published
    independently so they can be adopted by other projects beyond Signal itself.
- aid: signal:signal-libsignal-sdk
  name: Signal libsignal SDK
  tags:
  - SDK
  - Encryption
  - Cryptography
  - Java
  - Swift
  - TypeScript
  - Rust
  humanURL: https://github.com/signalapp/libsignal
  properties:
  - url: https://github.com/signalapp/libsignal
    type: GitHub
  - url: https://github.com/signalapp/libsignal
    type: Documentation
  description: >-
    The libsignal SDK provides platform-agnostic APIs used by the official Signal clients and server.
    It implements the Signal Protocol including the Double Ratchet algorithm, as well as other cryptographic
    primitives such as AES-GCM encryption and zero-knowledge group functionality. The core implementations
    are written in Rust, with bindings exposed as Java, Swift, and TypeScript libraries.
