aid: signal
url: https://raw.githubusercontent.com/api-evangelist/signal/refs/heads/main/apis.yml
modified: '2026-03-20'
common:
- type: JSON-LD
  url: json-ld/signal-context.jsonld
- type: JSONSchema
  url: json-schema/signal-protocol-entities-schema.json
apis:
  - aid: signal:signal-protocol
    name: Signal Protocol Specifications
    tags:
      - Encryption
      - Messaging
      - Cryptography
      - Security
      - Protocols
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://signal.org/docs/
    properties:
      - url: https://signal.org/docs/
        type: Documentation
    description: >-
      The Signal Protocol Specifications define the core cryptographic protocols
      that underpin Signal's end-to-end encrypted messaging. These include the
      X3DH (Extended Triple Diffie-Hellman) key agreement protocol for
      establishing shared secrets between parties, the Double Ratchet Algorithm
      for deriving new encryption keys per message, the PQXDH (Post-Quantum
      Extended Diffie-Hellman) protocol for quantum-resistant key agreement, and
      XEdDSA for EdDSA-compatible signature schemes. These specifications are
      published independently so they can be adopted by other projects beyond
      Signal itself.
  - aid: signal:libsignal-sdk
    name: Signal libsignal SDK
    tags:
      - SDK
      - Encryption
      - Cryptography
      - Java
      - Swift
      - TypeScript
      - Rust
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://github.com/signalapp/libsignal
    properties:
      - url: https://github.com/signalapp/libsignal
        type: Documentation
    description: >-
      The libsignal SDK provides platform-agnostic APIs used by the official
      Signal clients and server. It implements the Signal Protocol including the
      Double Ratchet algorithm, as well as other cryptographic primitives such as
      AES-GCM encryption and zero-knowledge group functionality. The core
      implementations are written in Rust, with bindings exposed as Java, Swift,
      and TypeScript libraries. Developers building applications that need
      Signal-compatible end-to-end encryption can integrate libsignal to handle
      key exchange, message encryption, and decryption.
  - aid: signal:signal-server
    name: Signal Server
    tags:
      - Messaging
      - Server
      - Backend
      - Encryption
      - Open Source
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://chat.signal.org
    humanURL: https://github.com/signalapp/Signal-Server
    properties:
      - url: https://github.com/signalapp/Signal-Server
        type: Documentation
      - url: openapi/signal-server-openapi.yml
        type: OpenAPI
      - url: asyncapi/signal-server-asyncapi.yml
        type: AsyncAPI
    description: >-
      Signal-Server is the open-source server backend that supports the Signal
      Private Messenger applications on Android, Desktop, and iOS. Built as a
      Dropwizard application, it provides REST controllers for account
      management, message delivery, key distribution, and device provisioning,
      along with gRPC services and WebSocket endpoints for real-time
      communication. The server handles user registration, encrypted message
      routing, push notification delivery, and pre-key bundle management. While
      Signal does not offer an official public REST API for third-party use, the
      server source code is available for inspection and self-hosting.
  - aid: signal:signal-android-sdk
    name: Signal Android SDK
    tags:
      - Android
      - Mobile
      - Messaging
      - Encryption
      - Open Source
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://github.com/signalapp/Signal-Android
    properties:
      - url: https://github.com/signalapp/Signal-Android
        type: Documentation
    description: >-
      Signal-Android is the open-source Android client for the Signal encrypted
      messaging platform. It provides the full messaging experience including
      end-to-end encrypted text messages, voice calls, video calls, group chats,
      and media sharing. The application integrates the libsignal protocol
      library for cryptographic operations and communicates with the Signal
      Server for message routing and delivery. The source code is publicly
      available, allowing developers to study the implementation of secure
      messaging on the Android platform.
  - aid: signal:signal-ios-sdk
    name: Signal iOS SDK
    tags:
      - iOS
      - Mobile
      - Messaging
      - Encryption
      - Open Source
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://github.com/signalapp/Signal-iOS
    properties:
      - url: https://github.com/signalapp/Signal-iOS
        type: Documentation
    description: >-
      Signal-iOS is the open-source iOS client for the Signal encrypted
      messaging platform. It delivers end-to-end encrypted messaging, voice
      calls, video calls, and group communications on iPhone and iPad devices.
      The application uses the libsignal protocol library for all cryptographic
      operations and connects to the Signal Server infrastructure for message
      delivery and synchronization. The codebase is publicly available on
      GitHub, enabling developers to review the secure messaging implementation
      for Apple platforms.
  - aid: signal:signal-desktop-sdk
    name: Signal Desktop SDK
    tags:
      - Desktop
      - Electron
      - Messaging
      - Encryption
      - Open Source
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://github.com/signalapp/Signal-Desktop
    properties:
      - url: https://github.com/signalapp/Signal-Desktop
        type: Documentation
    description: >-
      Signal-Desktop is the open-source desktop client for the Signal encrypted
      messaging platform, built with Electron and TypeScript. It provides
      end-to-end encrypted messaging, voice calls, video calls, and group
      communications on Windows, macOS, and Linux. The desktop client links to
      an existing Signal mobile account and synchronizes messages across devices.
      It integrates the libsignal TypeScript bindings for cryptographic
      operations and maintains the same security guarantees as the mobile
      applications.
