description: Signal is a non-profit messaging service operated by the Signal Foundation/Signal Messenger
  LLC and funded entirely by donations. Signal does not offer a commercial public API or paid plans.
  The protocol (Signal Protocol) and clients are open source; the production messaging service is not
  exposed as a public, billable API.
sources:
  - https://www.signal.org/donate/
  - https://signal.org/
notes: Signal is donation-funded and does not publish commercial API plans. Reconciliation pending
  any future change to Signal's offering.
plans:
  - id: signal-non-commercial
    name: Non-Commercial / Donation-Funded
    type: enterprise
    description: Signal provides its messaging service free of charge to end users; there is no commercial
      API SKU, no developer plan, and no per-call pricing. Use of the Signal Protocol via open source
      libraries is governed by upstream license terms rather than a Signal Foundation contract.
    entries:
      - label: End-User Service
        name: end_user_service
        type: flat
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: free / donation-supported
        userMultiplied: false
    elements:
      - name: Signal Messenger Apps
      - name: Open Source Signal Protocol Libraries
      - name: Donation-Funded Service
