description: FOCUS-aligned FinOps placeholder for Signal. Signal is a donation-funded non-profit;
  there is no commercial API, no invoice issued to consumers of the service, and no FOCUS data export.
  This artifact is included for catalog completeness only.
sources:
  - https://www.signal.org/donate/
notes: Signal is non-commercial. No billing model, FOCUS columns, or meters apply; this artifact
  exists solely so consumers understand the absence of a billable surface.
