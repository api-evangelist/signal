    description: Signal does not bill consumers and emits no usage meter for FinOps purposes.
    unit: varies
    aggregation: sum
principles:
  - name: Visibility
    description: There is no consumer-facing spend on Signal; visibility is limited to optional donations
      that an organization may make to the Signal Foundation.
  - name: Allocation
    description: Donations may be allocated to the philanthropy/community-investment cost center if
      a company chooses to support Signal.
  - name: Optimization
    description: Not applicable — there is no usage cost to optimize.
  - name: Accountability
    description: If donating, the giving entity (foundation, philanthropy, or executive sponsor) owns
      the donation decision; engineering does not own a spend line.
