naftiko: 1.0.0-alpha2
info:
  label: Signal Server API — Certificates
  description: 'Signal Server API — Certificates. 1 operations. Lead operation: Get a sealed sender delivery certificate.
    Self-contained Naftiko capability covering one Signal business surface.'
  tags:
  - Signal
  - Certificates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SIGNAL_API_KEY: SIGNAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: server-certificates
    baseUri: https://chat.signal.org
    description: Signal Server API — Certificates business capability. Self-contained, no shared references.
    resources:
    - name: v1-certificate-delivery
      path: /v1/certificate/delivery
      operations:
      - name: getdeliverycertificate
        method: GET
        description: Get a sealed sender delivery certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: includeE164
          in: query
          type: boolean
          description: Whether to include the E164 phone number in the certificate.
    authentication:
      type: bearer
      token: '{{env.SIGNAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: server-certificates-rest
    port: 8080
    description: REST adapter for Signal Server API — Certificates. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/certificate/delivery
      name: v1-certificate-delivery
      description: REST surface for v1-certificate-delivery.
      operations:
      - method: GET
        name: getdeliverycertificate
        description: Get a sealed sender delivery certificate
        call: server-certificates.getdeliverycertificate
        with:
          includeE164: rest.includeE164
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: server-certificates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Signal Server API — Certificates. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-sealed-sender-delivery-certificate
      description: Get a sealed sender delivery certificate
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: server-certificates.getdeliverycertificate
      with:
        includeE164: tools.includeE164
      outputParameters:
      - type: object
        mapping: $.
