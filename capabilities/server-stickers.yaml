naftiko: 1.0.0-alpha2
info:
  label: Signal Server API — Stickers
  description: 'Signal Server API — Stickers. 1 operations. Lead operation: Get sticker pack upload form. Self-contained Naftiko
    capability covering one Signal business surface.'
  tags:
  - Signal
  - Stickers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SIGNAL_API_KEY: SIGNAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: server-stickers
    baseUri: https://chat.signal.org
    description: Signal Server API — Stickers business capability. Self-contained, no shared references.
    resources:
    - name: v1-sticker-pack-form-packSize
      path: /v1/sticker/pack/form/{packSize}
      operations:
      - name: getstickerpackuploadform
        method: GET
        description: Get sticker pack upload form
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: packSize
          in: path
          type: integer
          description: The number of stickers in the pack.
          required: true
    authentication:
      type: bearer
      token: '{{env.SIGNAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: server-stickers-rest
    port: 8080
    description: REST adapter for Signal Server API — Stickers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/sticker/pack/form/{packsize}
      name: v1-sticker-pack-form-packsize
      description: REST surface for v1-sticker-pack-form-packSize.
      operations:
      - method: GET
        name: getstickerpackuploadform
        description: Get sticker pack upload form
        call: server-stickers.getstickerpackuploadform
        with:
          packSize: rest.packSize
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: server-stickers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Signal Server API — Stickers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-sticker-pack-upload-form
      description: Get sticker pack upload form
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: server-stickers.getstickerpackuploadform
      with:
        packSize: tools.packSize
      outputParameters:
      - type: object
        mapping: $.
