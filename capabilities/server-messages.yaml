naftiko: 1.0.0-alpha2
info:
  label: Signal Server API — Messages
  description: 'Signal Server API — Messages. 1 operations. Lead operation: Send an encrypted message. Self-contained Naftiko
    capability covering one Signal business surface.'
  tags:
  - Signal
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SIGNAL_API_KEY: SIGNAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: server-messages
    baseUri: https://chat.signal.org
    description: Signal Server API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: v1-messages-destinationUuid
      path: /v1/messages/{destinationUuid}
      operations:
      - name: sendmessage
        method: PUT
        description: Send an encrypted message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SIGNAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: server-messages-rest
    port: 8080
    description: REST adapter for Signal Server API — Messages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/messages/{destinationuuid}
      name: v1-messages-destinationuuid
      description: REST surface for v1-messages-destinationUuid.
      operations:
      - method: PUT
        name: sendmessage
        description: Send an encrypted message
        call: server-messages.sendmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: server-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Signal Server API — Messages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: send-encrypted-message
      description: Send an encrypted message
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: server-messages.sendmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
