      path: /v1/accounts/attributes
      operations:
      - name: setaccountattributes
        method: PUT
        description: Set account attributes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-accounts-number
      path: /v1/accounts/number
      operations:
      - name: changenumber
