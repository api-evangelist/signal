naftiko: "1.0.0-alpha1"

info:
  label: "Signal Server API"
  description: "Backend REST API for Signal Private Messenger supporting account management, encrypted message delivery, key distribution, and device provisioning."
  tags:
    - Messaging
    - Encryption
    - Privacy
    - Security
    - Open Source
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SIGNAL_USERNAME: SIGNAL_USERNAME
      SIGNAL_PASSWORD: SIGNAL_PASSWORD

capability:
  consumes:
    - type: http
      namespace: signal-server
      baseUri: https://chat.signal.org
      description: "Signal Server REST API for private encrypted messaging"
      authentication:
        type: basic
        username: "{{SIGNAL_USERNAME}}"
        password: "{{SIGNAL_PASSWORD}}"
      resources:
        - name: registration
          path: /v1/registration
          description: "Account registration"
          operations:
            - name: register-account
              method: POST
              description: "Register a new Signal account"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: account-identity
          path: /v1/accounts/whoami
          description: "Current account identity"
          operations:
            - name: get-account-identity
              method: GET
              description: "Get current account identity"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: account-attributes
          path: /v1/accounts/attributes
          description: "Account attributes management"
          operations:
            - name: set-account-attributes
              method: PUT
              description: "Set account attributes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: devices
          path: /v1/devices
          description: "Device management"
          operations:
            - name: list-devices
              method: GET
              description: "List linked devices"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: messages
          path: /v1/messages/{destinationUuid}
          description: "Encrypted message delivery"
          operations:
            - name: send-message
              method: PUT
              description: "Send encrypted messages to a destination account"
              inputParameters:
                - name: destinationUuid
                  in: path
                  type: string
                  required: true
                  description: "Destination account UUID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: keys
          path: /v2/keys
          description: "Pre-key bundle management"
          operations:
            - name: get-pre-key-bundle
              method: GET
              description: "Get pre-key bundle for key exchange"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: profile
          path: /v1/profile/{uuid}
          description: "User profile"
          operations:
            - name: get-profile
              method: GET
              description: "Get user profile"
              inputParameters:
                - name: uuid
                  in: path
                  type: string
                  required: true
                  description: "Account UUID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: signal-server-rest
      resources:
        - path: /v1/accounts/whoami
          name: account-identity
          operations:
            - method: GET
              name: get-account-identity
              description: "Get current account identity"

    - type: mcp
      port: 9100
      namespace: signal-server-mcp
      transport: http
      tools:
        - name: get-account-identity
          description: "Get the Signal account identity for the current user"
          hints:
            readOnly: true
            openWorld: false
          call: "signal-server.get-account-identity"
          outputParameters:
            - type: object
              mapping: "$."
